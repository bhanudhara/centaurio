services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskbuilder
    ports:
      - '5432:5432'
    volumes:
      - taskbuilder-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d taskbuilder']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskbuilder-data: